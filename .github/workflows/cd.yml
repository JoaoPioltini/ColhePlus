name: CD Deploy EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd ColhePlus

            if [ -f app.pid ]; then
              kill "$(cat app.pid)" || true
              rm -f app.pid
            fi

            git fetch origin main
            git reset --hard origin/main
            git clean -fdx

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2 || sudo apt-get install -y docker.io docker-compose-plugin || sudo apt-get install -y docker.io docker-compose
            fi
            sudo systemctl enable --now docker

            if sudo docker compose version >/dev/null 2>&1; then
              COMPOSE="sudo docker compose"
            else
              COMPOSE="sudo docker-compose"
            fi

            $COMPOSE up -d postgres
            for i in $(seq 1 30); do
              if $COMPOSE exec -T postgres pg_isready -U colheplus -d colheplus; then
                break
              fi
              sleep 2
            done
            $COMPOSE exec -T postgres pg_isready -U colheplus -d colheplus

            mvn clean package -DskipTests

            nohup java -jar target/colheplus-1.0.jar > app.log 2>&1 &
            echo $! > app.pid

            sleep 10
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              cat app.log
              exit 1
            fi

            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            sudo tee /etc/nginx/sites-available/colheplus >/dev/null <<'NGINX'
            server {
                listen 80 default_server;
                server_name _;

                location / {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo ln -sf /etc/nginx/sites-available/colheplus /etc/nginx/sites-enabled/colheplus
            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx
