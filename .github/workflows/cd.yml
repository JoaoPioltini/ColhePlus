name: CD Deploy EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd ColhePlus

            if [ -f app.pid ]; then
              kill "$(cat app.pid)" || true
              rm -f app.pid
            fi

            git fetch origin main
            git reset --hard origin/main
            git clean -fdx

            mvn clean package -DskipTests

            nohup java -jar target/colheplus-1.0.jar > app.log 2>&1 &
            echo $! > app.pid

            sleep 10
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              cat app.log
              exit 1
            fi
