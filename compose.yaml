services:
  postgres:
    image: postgres:16-alpine
    container_name: colheplus-postgres
    environment:
      POSTGRES_DB: colheplus
      POSTGRES_USER: colheplus
      POSTGRES_PASSWORD: colheplus
    ports:
      - "5432:5432"
    volumes:
      - colheplus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colheplus -d colheplus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  colheplus-postgres-data:
